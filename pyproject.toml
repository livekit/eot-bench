[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eot-bench"
version = "0.1.0"
description = "Small end-of-turn evaluation harness for model adapter comparisons."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "datasets>=3.2.0",
    "huggingface_hub>=0.30.0",
    "librosa>=0.10.0",
    "livekit-agents>=1.6.0rc2",
    "matplotlib>=3.8.0",
    "modal>=1.0.0",
    "numpy<2",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "soundfile>=0.12.1",
    "websockets>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
vap = [
    "einops==0.8.1",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "vap @ git+https://github.com/ErikEkstedt/VoiceActivityProjection.git@f39a78b23a6dccdbedd106e00b48c410b8739f5d",
]

[project.scripts]
eot-harness = "eot_harness.cli:main"

[tool.setuptools.packages.find]
include = ["eot_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
